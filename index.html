<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Library</title>

        <link rel="stylesheet" href="css/styles.css">
        <script src="js/script.js" defer></script>
    </head>
    <body>
        <div class="content">
            <div class="header">
                <h1>Library</h1>
                <button type="button" class="btn-add-book" id="btn-add-book">Add book</button>
            </div>
            <div class="main" id="bookshelf">

            </div>
        </div>
        <dialog class="book-modal">
            <h3>Add book</h3>
            <form>
                <div class="form-row">
                    <label for="title">Title: </label>
                    <input type="text" id="title" name="title">
                </div>
                <div class="form-row">
                    <label for="author">Author: </label>
                    <input type="text" id="author" name="author">
                </div>
                <div class="form-row">
                    <label for="publisher">Publisher: </label>
                    <input type="text" id="publisher" name="publisher">
                </div>
                <div class="form-row">
                    <label for="genre">Genre: </label>
                    <input type="text" id="genre" name="genre">
                </div>
                <div class="form-row">
                    <label for="pages">Page count: </label>
                    <input type="text" id="pages" name="pages">
                </div>
                <div class="form-row">
                    <label for="status">Status: </label>
                    <input type="text" id="status" name="status">
                </div>
                <button type="submit">Add</button>
            </form>
            <button class="btn-close-modal" id="btn-close-modal">close</button>
        </dialog>
    </body>
</html>
